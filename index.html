<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과일모찌 먹기 모캡</title>
<style>
:root{--ink:#3b1f2b;--pink:#ff8fa3;--cream:#fff4f0}
html,body{margin:0;height:100%;background:#1b1116;color:#fff;font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
video,canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
#msg{position:fixed;left:0;right:0;top:16px;text-align:center;font-size:20px;font-weight:600;text-shadow:0 1px 8px #000;pointer-events:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--cream);color:var(--ink);text-align:center;padding:24px}
#start h1{margin:0;font-size:32px}
#start p{margin:0;max-width:26em;line-height:1.6}
button{font:inherit;font-size:20px;font-weight:600;padding:14px 32px;border:0;border-radius:999px;background:var(--pink);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div id="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div id="msg"></div>
<div id="start">
  <h1>과일모찌 먹기</h1>
  <p>웹캠에 얼굴을 비추면 접시에 모찌가 나타나요. 엄지와 검지로 집어서 입으로 가져가 보세요.</p>
  <button id="go">카메라 시작</button>
  <p id="err" style="color:#b3243c"></p>
</div>

<script type="module">
import {FaceLandmarker,HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id);
const video=$('v'),cv=$('c'),ctx=cv.getContext('2d'),msg=$('msg');
const BASE="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const FM="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const HM="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
let W,H,R,home,fl,hl,face=null,hands=[],last=-1;
const S={state:'wait',plate:0,ff:0,grab:false,m:{x:0,y:0},a:1,mh:null,hh:null,w:0,t1:0,snap:null,pinPrev:[false,false]};
let pin=null,mouth=null,fh=1,open=false;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const P=l=>({x:l.x*W,y:l.y*H});
const bean=Array.from({length:40},()=>{const a=Math.random()*6.28,r=Math.sqrt(Math.random());return[Math.cos(a)*r,Math.sin(a)*r,Math.random()*.05+.025]});

$('go').onclick=async()=>{
  const b=$('go');
  try{
    b.disabled=true;b.textContent='불러오는 중…';
    const st=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});
    video.srcObject=st;await video.play();
    W=cv.width=video.videoWidth;H=cv.height=video.videoHeight;
    R=H*.075;home={x:W/2,y:H*.82-R*.4};
    fit();addEventListener('resize',fit);
    const fs=await FilesetResolver.forVisionTasks(BASE+"/wasm");
    const make=async(C,path,extra)=>{
      for(const d of ['GPU','CPU']){
        try{return await C.createFromOptions(fs,{baseOptions:{modelAssetPath:path,delegate:d},runningMode:'VIDEO',...extra})}catch(e){if(d==='CPU')throw e}
      }
    };
    fl=await make(FaceLandmarker,FM,{numFaces:1});
    hl=await make(HandLandmarker,HM,{numHands:2});
    $('start').remove();
    requestAnimationFrame(loop);
  }catch(e){
    $('err').textContent='오류: '+e.message+' (카메라 권한과 인터넷 연결을 확인해 주세요)';
    b.disabled=false;b.textContent='다시 시도';
  }
};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),st=$('stage').style;st.width=W*s+'px';st.height=H*s+'px'}

function loop(t){
  if(video.currentTime!==last){
    last=video.currentTime;
    face=fl.detectForVideo(video,t).faceLandmarks[0]||null;
    hands=hl.detectForVideo(video,t+1).landmarks||[];
  }
  update(t);draw(t);
  requestAnimationFrame(loop);
}

function resetMochi(){S.m={x:home.x,y:home.y};S.grab=false;S.a=0;S.state='ready'}

function update(t){
  // face / mouth
  mouth=null;open=false;
  if(face){
    const u=P(face[13]),l=P(face[14]);
    mouth={x:(u.x+l.x)/2,y:(u.y+l.y)/2};
    fh=dist(P(face[10]),P(face[152]));
    open=dist(u,l)/fh>.05;
    S.ff++;
  }else S.ff=0;
  // pinch (thumb tip 4 + index tip 8)
  pin=null;
  hands.forEach((h,i)=>{
    const a=P(h[4]),b=P(h[8]),d=dist(a,b)/dist(P(h[0]),P(h[9]));
    const on=d<.32||(S.pinPrev[i]&&d<.5);
    S.pinPrev[i]=on;
    const p={x:(a.x+b.x)/2,y:(a.y+b.y)/2,on};
    if(!pin||(on&&!pin.on))pin=p;
  });
  S.plate+=((S.state==='wait'?0:1)-S.plate)*.12;
  S.a=Math.min(1,S.a+.05);

  if(S.state==='wait'){
    if(S.ff>15)resetMochi();
  }else if(S.state==='ready'){
    if(pin&&pin.on){if(!S.grab&&dist(pin,S.m)<R*1.8)S.grab=true}else S.grab=false;
    const tg=S.grab?pin:home,k=S.grab?.5:.15;
    S.m.x+=(tg.x-S.m.x)*k;S.m.y+=(tg.y-S.m.y)*k;
    if(S.grab&&mouth&&open&&dist(S.m,mouth)<fh*.3){
      S.state='bitten';
      S.hh={x:S.m.x,y:S.m.y};S.mh={x:mouth.x,y:mouth.y};
    }
  }else if(S.state==='bitten'||S.state==='snapped'){
    if(mouth){S.mh.x+=(mouth.x-S.mh.x)*.4;S.mh.y+=(mouth.y-S.mh.y)*.4}
    if(pin&&pin.on){S.hh.x+=(pin.x-S.hh.x)*.5;S.hh.y+=(pin.y-S.hh.y)*.5}
    if(S.state==='bitten'){
      const d=dist(S.mh,S.hh);
      S.w=R*.9*Math.min(1,Math.max(0,1-(d-R*1.6)/(H*.45)));
      if(S.w<3&&d>R*2){S.state='snapped';S.t1=t;S.snap={dx:(S.hh.x-S.mh.x)/d,dy:(S.hh.y-S.mh.y)/d,len:d*.5}}
    }else if(t-S.t1>4500)resetMochi();
  }
  msg.textContent={
    wait:'얼굴을 카메라에 비춰주세요',
    ready:S.grab?'입을 벌리고 모찌를 가져가 보세요':'엄지와 검지로 모찌를 집어보세요',
    bitten:'손을 멀리 당겨서 쭉 늘려보세요',
    snapped:'냠냠 🍓'
  }[S.state];
}

function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}

function drawPlate(){
  if(S.plate<.01)return;
  ctx.save();ctx.translate(home.x,home.y+R*.8);ctx.scale(S.plate,S.plate);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,R*.25,R*3.4,R*1.15,0,0,7);ctx.fill();
  ctx.fillStyle='#e6effa';ctx.strokeStyle='#9db8e0';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(0,0,R*3.3,R*1.1,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,R*.05,R*2.5,R*.8,0,0,7);ctx.fill();
  ctx.restore();
}

function drawWhole(x,y){
  ctx.save();ctx.globalAlpha=S.a;
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y+R*.75,R*1.05,R*.25,0,0,7);ctx.fill();
  const g=ctx.createRadialGradient(x-R*.35,y-R*.4,R*.1,x,y,R*1.1);
  g.addColorStop(0,'#fff');g.addColorStop(1,'#f2dfe4');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,R*1.05,R*.88,0,0,7);ctx.fill();
  ctx.restore();
}

// cross-section of a mochi half: skin, red bean, strawberry
function drawHalf(x,y,rad,rot){
  if(rad<1)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=10;
  ctx.fillStyle='#fff';circ(0,0,rad);ctx.shadowBlur=0;
  let g=ctx.createRadialGradient(-rad*.2,-rad*.2,rad*.1,0,0,rad*.85);
  g.addColorStop(0,'#8a3a48');g.addColorStop(1,'#4b1621');
  ctx.fillStyle=g;circ(0,0,rad*.84);
  ctx.fillStyle='rgba(255,190,190,.28)';
  bean.forEach(([a,b,s])=>circ(a*rad*.78,b*rad*.78,s*rad));
  g=ctx.createRadialGradient(0,0,rad*.05,0,0,rad*.52);
  g.addColorStop(0,'#ffc2c9');g.addColorStop(.55,'#ff6a7d');g.addColorStop(1,'#d91f3a');
  ctx.fillStyle=g;circ(0,0,rad*.52);
  ctx.fillStyle='#ffe8ea';circ(0,0,rad*.14);
  ctx.fillStyle='#ffe28a';
  for(let i=0;i<9;i++){const a=i/9*6.28;circ(Math.cos(a)*rad*.34,Math.sin(a)*rad*.34,rad*.028)}
  ctx.restore();
}

// tapered, sagging mochi-skin strand between a and b
function strand(a,b,wa,wb,dip,sag,off=0){
  const d=dist(a,b)||1,nx=-(b.y-a.y)/d,ny=(b.x-a.x)/d;
  const c={x:(a.x+b.x)/2+nx*off,y:(a.y+b.y)/2+ny*off+sag};
  const L=[],Rr=[],N=28;
  for(let i=0;i<=N;i++){
    const t=i/N,u=1-t;
    const x=u*u*a.x+2*u*t*c.x+t*t*b.x,y=u*u*a.y+2*u*t*c.y+t*t*b.y;
    const tx=2*u*(c.x-a.x)+2*t*(b.x-c.x),ty=2*u*(c.y-a.y)+2*t*(b.y-c.y),tl=Math.hypot(tx,ty)||1;
    const w=Math.max(1.5,wa+(wb-wa)*t-dip*Math.pow(Math.sin(Math.PI*t),.6))/2;
    L.push([x-ty/tl*w,y+tx/tl*w]);Rr.push([x+ty/tl*w,y-tx/tl*w]);
  }
  ctx.beginPath();L.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i][0],Rr[i][1]);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.strokeStyle='rgba(255,170,190,.55)';ctx.lineWidth=1.5;
  ctx.fill();ctx.stroke();
}

function draw(t){
  ctx.clearRect(0,0,W,H);
  drawPlate();
  if(S.state==='ready')drawWhole(S.m.x,S.m.y);
  else if(S.state==='bitten'){
    const d=dist(S.mh,S.hh),ten=S.w/(R*.9),we=R*.85;
    strand(S.mh,S.hh,we,we,we-S.w,(1-ten)*0+d*.2*ten);
    strand(S.mh,S.hh,we*.5,we*.5,we*.5-S.w*.5,d*.2*ten,R*.5*ten);
    strand(S.mh,S.hh,we*.5,we*.5,we*.5-S.w*.5,d*.2*ten,-R*.5*ten);
    drawHalf(S.mh.x,S.mh.y,R*.8,-.4);
    drawHalf(S.hh.x,S.hh.y,R*.85,.5);
  }else if(S.state==='snapped'){
    const k=Math.min(1,(t-S.t1)/700),e=k*k*(3-2*k),len=S.snap.len*(1-e);
    if(k<1){
      const ma={x:S.mh.x+S.snap.dx*len,y:S.mh.y+S.snap.dy*len+e*R*2};
      const ha={x:S.hh.x-S.snap.dx*len,y:S.hh.y-S.snap.dy*len+e*R*2};
      strand(S.mh,ma,R*.5,1.5,0,R*.3*e);
      strand(S.hh,ha,R*.5,1.5,0,R*.3*e);
    }
    const chew=Math.max(0,1-(t-S.t1)/1200);
    drawHalf(S.mh.x,S.mh.y,R*.8*chew*(1+.06*Math.sin(t/70)),-.4);
    drawHalf(S.hh.x,S.hh.y,R*.85,.5);
  }
  // pinch marker
  if(pin){
    ctx.strokeStyle='#ff8fa3';ctx.lineWidth=3;ctx.fillStyle='rgba(255,143,163,.55)';
    ctx.beginPath();ctx.arc(pin.x,pin.y,R*.3,0,7);pin.on?ctx.fill():ctx.stroke();
  }
}
</script>
</body>
</html>
